<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디지털 웰빙 타이머</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 화면 1: 목표 시간 설정 화면 -->
  <section id="setup-screen" class="screen">
    <h1>📵 디지털 웰빙 타이머</h1>
    <p class="subtitle">목표 시간을 정하고 폰과 멀어져 보세요</p>

    <div class="time-display">
      <span id="minutes-value">10</span><span class="unit">분</span>
    </div>

    <input
      type="range"
      id="minutes-slider"
      min="1"
      max="120"
      step="1"
      value="10"
    />

    <div class="quick-buttons">
      <button type="button" class="quick-btn" data-minutes="10">10분</button>
      <button type="button" class="quick-btn" data-minutes="25">25분</button>
      <button type="button" class="quick-btn" data-minutes="50">50분</button>
    </div>

    <p class="notice">⚠️ 타이머 중에 다른 앱이나 탭으로 나가면 실패로 처리돼요.</p>
    <p class="notice warning hidden" id="wakelock-warning">
      이 기기는 화면 꺼짐 방지를 지원하지 않아요.<br />
      설정 → 디스플레이 및 밝기 → 자동 잠금을 <b>안 함</b>으로 바꿔주세요.
    </p>

    <button type="button" id="start-btn" class="primary-btn">시작하기</button>
    <button type="button" id="stats-btn" class="text-btn">📊 내 기록 보기</button>
  </section>

  <!-- 화면 2: 타이머 실행 화면 -->
  <section id="timer-screen" class="screen hidden">
    <p class="running-label" id="running-label">폰을 멀리하고 목표를 지켜보세요</p>

    <div class="countdown" id="countdown">10:00</div>

    <button type="button" id="cancel-btn" class="secondary-btn">포기하기</button>
    <button type="button" id="restart-btn" class="primary-btn hidden">다시 하기</button>
  </section>

  <!-- 화면 3: 내 기록 화면 -->
  <section id="stats-screen" class="screen hidden">
    <h2 class="screen-title">📊 내 기록</h2>

    <div class="stat-grid">
      <div class="stat">
        <span class="stat-value" id="stat-success">0</span>
        <span class="stat-label">성공</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-fail">0</span>
        <span class="stat-label">실패</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-rate">0%</span>
        <span class="stat-label">성공률</span>
      </div>
    </div>

    <div class="total-time">
      누적 집중 시간 <b id="stat-total">0분</b>
    </div>

    <h3 class="list-title">최근 기록</h3>
    <p class="notice" id="record-empty">
      아직 기록이 없어요. 타이머를 끝까지 해보면 여기에 쌓입니다.
    </p>
    <ul class="record-list" id="record-list"></ul>

    <button type="button" id="stats-back-btn" class="primary-btn">돌아가기</button>
    <button type="button" id="clear-btn" class="secondary-btn">기록 전체 삭제</button>
  </section>

  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
